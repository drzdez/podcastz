[project]
name = "podcastz"
version = "0.1.0"
license = "MIT"
description = "Turn two-voice dialogue scripts into podcast audio with TTS (OpenAI, ElevenLabs), with cost estimates and a content-hash cache."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
podcastz = "podcastz.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcastz"]
